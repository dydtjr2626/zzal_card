<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통합 Card Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 좌측: 메인 에디터 영역 (카드 1, 2) -->
        <main class="editor-area">
            <header class="header">
                <h2>Card Studio Editor</h2>
                <div class="ratio-controls">
                    <span>화면 비율:</span>
                    <button class="ratio-btn active" onclick="changeRatio('1/1', this)">1:1</button>
                    <button class="ratio-btn" onclick="changeRatio('4/5', this)">4:5</button>
                    <button class="ratio-btn" onclick="changeRatio('9/16', this)">9:16</button>
                </div>
            </header>

            <div class="canvas-wrapper">
                <!-- 캔버스 (미리보기) -->
                <div class="canvas-container" id="canvas-area">
                    <img id="preview-img" class="canvas-image" src="" alt="Preview" style="display:none;">
                    <span id="preview-text" class="canvas-text">텍스트를 입력하세요</span>
                    <span id="placeholder-text" class="placeholder">이미지 없음</span>
                </div>
            </div>

            <!-- 편집 컨트롤러 -->
            <div class="editor-controls">
                <div class="control-group">
                    <label>이미지 업로드 (PNG/JPEG 전용)</label>
                    <input type="file" id="image-upload" accept="image/png, image/jpeg" onchange="handleImageUpload(event)">
                    <div class="validation-msg" id="file-msg"></div>
                </div>

                <div class="control-group">
                    <label>문구 입력</label>
                    <input type="text" id="text-input" placeholder="문구를 입력하세요" oninput="updateText(event)">
                </div>

                <div class="sliders">
                    <div class="control-group">
                        <label>크기 <span id="size-val">24px</span></label>
                        <input type="range" id="size-slider" min="10" max="80" value="24" oninput="updateTextStyle()">
                    </div>
                    <div class="control-group">
                        <label>가로 위치 <span id="pos-x-val">50%</span></label>
                        <input type="range" id="pos-x-slider" min="0" max="100" value="50" oninput="updateTextStyle()">
                    </div>
                    <div class="control-group">
                        <label>세로 위치 <span id="pos-y-val">50%</span></label>
                        <input type="range" id="pos-y-slider" min="0" max="100" value="50" oninput="updateTextStyle()">
                    </div>
                    <div class="control-group">
                        <label>색상</label>
                        <input type="color" id="color-input" value="#ffffff" oninput="updateTextStyle()">
                    </div>
                </div>
                
                <button class="btn-primary" onclick="downloadPreview()">결과 다운로드 (Mock)</button>
            </div>
        </main>

        <!-- 우측: 데이터 및 관리 영역 (카드 3, 4, 5) -->
        <aside class="sidebar">
            <!-- Card 3: 다중 입력 12건 -->
            <section class="panel">
                <h3>다중 입력 검사 (12건)</h3>
                <p class="desc">예상값이 있는 굵단 입력 12개를 검사합니다. (빈 칸 불가)</p>
                <div class="multi-input-grid" id="multi-input-container">
                    <!-- JS로 생성 -->
                </div>
                <button class="btn-primary mt-10" onclick="saveCard3()">12건 검사 및 대표 결과 전송</button>
                <div class="validation-msg" id="card3-msg"></div>
            </section>

            <!-- Card 4: 템플릿 관리 -->
            <section class="panel">
                <h3>템플릿 관리 (CRUD)</h3>
                <div class="template-create">
                    <input type="text" id="new-template-name" placeholder="새 템플릿 이름">
                    <button class="btn-secondary" onclick="createTemplate()">생성</button>
                </div>
                <ul class="template-list" id="template-list">
                    <!-- JS로 렌더링 -->
                </ul>
            </section>

            <!-- Card 5: JSON 처리 -->
            <section class="panel">
                <h3>JSON 시험 및 완성본</h3>
                <p class="desc">정상 JSON 복원 및 결함 JSON 거부를 테스트합니다.</p>
                <div class="json-controls">
                    <button class="btn-primary" onclick="loadValidJson()">정상 JSON 불러오기</button>
                    <button class="btn-danger" onclick="loadInvalidJson()">결함 JSON 불러오기</button>
                </div>
                <div class="validation-msg" id="card5-msg"></div>
            </section>
        </aside>
    </div>
    <script src="script.js"></script>
</body>
</html>
